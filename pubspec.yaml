name: silsigan
description: "Korean to Vietnamese live translation app"
publish_to: 'none'
version: 1.0.16+56

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_sound: ^9.2.13
  web_socket_channel: ^3.0.1
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  permission_handler: ^11.3.1
  convert: ^3.1.1
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.3
  http: ^1.2.1
  device_info_plus: ^10.1.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  record: ^5.1.3
  share_plus: ^10.0.0
  flutter_foreground_task: ^8.10.0
  audioplayers: ^6.1.0
  flutter_tts: 4.0.2
  package_info_plus: 8.0.0
  url_launcher: ^6.3.1
  purchases_flutter: ^9.16.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0

dependency_overrides:
  record_linux: ^1.0.0
  web: ^1.1.1
  sqlite3: 2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "silsigan_icon.png"
    icon_size: 256
  image_path: "silsigan_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
