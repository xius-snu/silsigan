name: silsigan
description: "Korean to Vietnamese live translation app"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_sound: ^9.2.13
  web_socket_channel: ^3.0.1
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  permission_handler: ^11.3.1
  convert: ^3.1.1
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  http: ^1.2.1
  device_info_plus: ^10.1.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "silsigan_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
